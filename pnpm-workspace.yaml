  - packages/*
  - packages/spinetab/tests/fixtures/harness

engineStrict: true
saveExact: true

allowBuilds:
  esbuild: true
  sharp: true
  workerd: false

skills:
  dirs: []

# miniflare pins undici 7.29.1 exactly (GHSA-xjj6-f33q-929c). Remove this
# override once the wrangler release we use depends on undici 7.30.1 or later.
overrides:
  miniflare>undici: 7.30.1
