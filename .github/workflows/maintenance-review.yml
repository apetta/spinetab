name: Maintenance review

on:
  issue_comment:
    types: [created]
  check_run:
    types: [completed]
  workflow_run:
    workflows: [CI, Maintenance readiness]
    types: [completed]
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for owner-requested review (blank to sweep ordinary PRs)
        type: string
      expected_head:
        description: Full current PR commit SHA (required with a PR number)
        type: string
      authorise_policy:
        description: Authorise review of tooling, workflow and automation policy changes at this commit
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: maintenance-review
  cancel-in-progress: false
  queue: max

jobs:
  analyse:
    if: >-
      github.repository == 'apetta/spinetab' && github.ref == 'refs/heads/main' &&
      vars.MAINTENANCE_ENABLED == 'true' &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.actor == 'apetta' &&
      startsWith(github.event.comment.body, '<!-- spinetab-maintenance-authorisation -->'))) &&
      (github.event_name != 'check_run' ||
      (github.event.check_run.name == 'CodeQL' && github.event.check_run.app.id == 57789 &&
      github.event.check_run.conclusion == 'success')) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      pr: ${{ steps.prepare.outputs.pr }}
      head: ${{ steps.prepare.outputs.head }}
      base: ${{ steps.prepare.outputs.base }}
      ci_run: ${{ steps.prepare.outputs.ci_run }}
      ci_attempt: ${{ steps.prepare.outputs.ci_attempt }}
      decision: ${{ steps.verify.outputs.decision }}
      reason: ${{ steps.verify.outputs.reason }}
      supervisor_comment_id: ${{ steps.prepare.outputs.supervisor_comment_id }}
    env:
      ANTHROPIC_API_KEY: ""
      RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
      CLAUDE_CODE_EFFORT_LEVEL: high
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test trusted guards
        run: python3 -m unittest discover -s .github/maintenance -p '*_test.py'
      - name: Prepare current candidate evidence
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/maintenance/review.py prepare
      - name: Require configured review instructions
        if: steps.prepare.outputs.ready == 'true'
        env:
          REVIEW_PROMPT: ${{ secrets.MAINTENANCE_REVIEW_PROMPT }}
          MANUAL_REVIEW_PROMPT: ${{ secrets.MAINTENANCE_MANUAL_REVIEW_PROMPT }}
          MANUAL_HEAD: ${{ inputs.expected_head }}
          SUPERVISOR_COMMENT_ID: ${{ steps.prepare.outputs.supervisor_comment_id }}
        run: |
          if [ -n "$MANUAL_HEAD" ] || [ -n "$SUPERVISOR_COMMENT_ID" ]; then
            test -n "$MANUAL_REVIEW_PROMPT"
          else
            test -n "$REVIEW_PROMPT"
          fi
      - name: Review without executing candidate code
        if: steps.prepare.outputs.ready == 'true'
        id: agent
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
        with:
          github_token: ${{ github.token }}
          allowed_bots: "dependabot[bot],github-actions[bot],${{ vars.RELEASE_BOT_LOGIN }}"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "false"
          display_report: "false"
          classify_inline_comments: "false"
          prompt: ${{ (inputs.expected_head || steps.prepare.outputs.supervisor_comment_id) && secrets.MAINTENANCE_MANUAL_REVIEW_PROMPT || secrets.MAINTENANCE_REVIEW_PROMPT }}
          claude_args: >-
            --model claude-opus-5-5 --effort high --max-turns 18
            --restricted --permission-mode dontAsk --tools Read
            --allowedTools Read(review-input.json) --disallowedTools mcp__*
            --strict-mcp-config --mcp-config '{"mcpServers":{}}'
            --settings '{"permissions":{"deny":["Read(.git/**)","Read(.github/**)","Read(.env*)","Read(~/.claude/**)","Read(//proc/**)","Read(//tmp/**)"]}}'
            --json-schema '{"type":"object","additionalProperties":false,"required":["decision","reason"],"properties":{"decision":{"enum":["approve","request_changes","escalate"]},"reason":{"type":"string"}}}'
      - name: Verify subscription and evidence-only review
        if: steps.prepare.outputs.ready == 'true'
        id: verify
        env:
          VERDICT: ${{ steps.agent.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 .github/maintenance/review.py verify
      - name: Remove transient evidence
        if: always()
        run: rm -f review-input.json "$RUNNER_TEMP/claude-execution-output.json"

  review:
    needs: analyse
    if: needs.analyse.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      review_id: ${{ steps.review.outputs.review_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
      PR_NUMBER: ${{ needs.analyse.outputs.pr }}
      EXPECTED_HEAD: ${{ needs.analyse.outputs.head }}
      EXPECTED_BASE: ${{ needs.analyse.outputs.base }}
      CI_RUN: ${{ needs.analyse.outputs.ci_run }}
      CI_ATTEMPT: ${{ needs.analyse.outputs.ci_attempt }}
      DECISION: ${{ needs.analyse.outputs.decision }}
      REASON: ${{ needs.analyse.outputs.reason }}
      SUPERVISOR_COMMENT_ID: ${{ needs.analyse.outputs.supervisor_comment_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create the independent review identity
        id: identity
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          owner: apetta
          repositories: spinetab
          permission-pull-requests: write
      - name: Submit independent current-head review
        id: review
        env:
          REVIEW_TOKEN: ${{ steps.identity.outputs.token }}
        run: python3 .github/maintenance/review.py review

  merge:
    needs: [analyse, review]
    if: needs.analyse.outputs.decision == 'approve' && !(github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
      PR_NUMBER: ${{ needs.analyse.outputs.pr }}
      EXPECTED_HEAD: ${{ needs.analyse.outputs.head }}
      EXPECTED_BASE: ${{ needs.analyse.outputs.base }}
      CI_RUN: ${{ needs.analyse.outputs.ci_run }}
      CI_ATTEMPT: ${{ needs.analyse.outputs.ci_attempt }}
      DECISION: ${{ needs.analyse.outputs.decision }}
      REVIEW_ID: ${{ needs.review.outputs.review_id }}
      SUPERVISOR_COMMENT_ID: ${{ needs.analyse.outputs.supervisor_comment_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge the approved commit and trigger downstream CI
        run: python3 .github/maintenance/review.py merge
