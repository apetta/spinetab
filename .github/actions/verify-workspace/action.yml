name: Workspace verification
description: Build, typecheck and test the workspace with explicit cache boundaries.
inputs:
  release:
    description: Bypass task caching for publication verification
    default: "false"
  deploy:
    description: Preserve the tested main website for deployment
    default: "false"
  team:
    description: Vercel team used by trusted CI
    default: ""
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        install: false
    - name: Setup Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Restore and save task cache within GitHub's branch boundaries
      if: inputs.release != 'true' && inputs.team == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-
    - name: Authenticate to the shared remote build cache
      if: inputs.team != '' && inputs.release != 'true'
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      with:
        team: ${{ inputs.team }}
        audience: https://github.com/apetta
    - name: Biome
      shell: bash
      run: pnpm exec biome ci .
    - name: Markdown, MDX and YAML formatting
      shell: bash
      run: pnpm exec prettier --check .
    - name: Typecheck, unit tests, E2E
      shell: bash
      run: pnpm exec turbo run typecheck test e2e
    - name: Preserve tested website build
      if: >-
        inputs.release != 'true' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == 'true'))
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: website-build
        path: apps/website/dist/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    # The library suite runs Chromium, Firefox and WebKit against the fixture
    # server; the website suite covers navigation, themes and recipes. Reports
    # are kept for a week. Library changes also verify packed consumers below.
    - name: Upload Playwright reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-reports
        path: |
          packages/spinetab/playwright-report/
          apps/website/playwright-report/
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload Playwright failure output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: ${{ failure() }}
      with:
        name: playwright-test-results
        path: |
          packages/spinetab/test-results/playwright/
          apps/website/test-results/
        retention-days: 7
        if-no-files-found: ignore
