name: Maintenance readiness

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  ready:
    if: >-
      github.repository == 'apetta/spinetab' && github.actor_id == '33671231' &&
      github.triggering_actor == 'apetta' &&
      contains(fromJSON('["agent:ready","release:ready"]'), github.event.label.name) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Readiness event received; independent review follows completion.'
