name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified main commit after an automated merge
        type: boolean
        default: false
      expected_sha:
        description: Exact main commit for an automated deployment
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Maintenance guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test maintenance safeguards
        run: python3 -m unittest discover -s .github/maintenance -p '*_test.py'
      - name: Identify consumer verification scope
        id: scope
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '.github/maintenance')
          from review import consumer_checks_required
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event.get('pull_request')
          paths = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', pr['base']['sha'], pr['head']['sha']], text=True).splitlines() if pr else []
          package = consumer_checks_required(paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'package={str(package).lower()}\n')
          PY

  # Match the cache policy's immutable actor IDs: apetta, Dependabot and Actions.
  check:
    name: Verify workspace
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["33671231", "49699333", "41898282"]'), github.actor_id))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Match @playwright/test in apps/website/package.json. The image includes
    # the matching browser binaries and their system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # Share task results with local and hosted agents. Publication verification
    # bypasses both cache sources in release-verification.yml.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_CACHE: "local:rw,remote:rw"
    steps:
      - name: Validate automated deployment target
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          expected = os.environ['EXPECTED_SHA']
          if os.environ['GITHUB_REF'] != 'refs/heads/main' or not re.fullmatch('[0-9a-f]{40}', expected):
              raise SystemExit('Automated deployment requires an exact main commit')
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/main', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)['object']['sha']
          if current != expected:
              raise SystemExit('Main advanced; let the newer CI run deploy instead')
          PY
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          persist-credentials: false
      - name: Verify workspace
        uses: ./.github/actions/verify-workspace
        with:
          deploy: ${{ inputs.deploy || false }}
          team: ${{ vars.TURBO_TEAM }}

  check-pr:
    name: Verify without remote cache
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["33671231", "49699333", "41898282"]'), github.actor_id))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_CACHE: "local:rw,remote:"
    steps:
      - name: Require verification without OIDC access
        run: test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - name: Reject deployment from another branch
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          persist-credentials: false
      - name: Verify workspace
        uses: ./.github/actions/verify-workspace

  verified:
    name: Lint, Typecheck, Test, E2E
    needs: [check, check-pr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require exactly one successful workspace verification
        env:
          RESULTS: ${{ needs.check.result }}:${{ needs.check-pr.result }}
        run: test "$RESULTS" = success:skipped || test "$RESULTS" = skipped:success

  deploy:
    name: Deploy website to Cloudflare Pages
    needs: [check, scope]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Create isolated deployment workspace
        run: |
          mkdir deployment
          echo '{"private":true}' > deployment/package.json
      - name: Install trusted deployment tooling before credentials are available
        working-directory: deployment
        run: |
          npm install --ignore-scripts --save-exact wrangler@4.151.0
          npx --no-install wrangler --version
      - name: Download tested website build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: website-build
          path: deployment/dist/
      - name: Deploy tested website build
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deployment
          packageManager: npm
          wranglerVersion: "4.151.0"
          command: pages deploy dist --project-name=spinetab --branch=main --commit-hash=${{ inputs.expected_sha || github.sha }}

  verify-deployment:
    name: Verify deployed documentation
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed documentation routes and caching
        env:
          WEBSITE_TEST_URL: ${{ needs.deploy.outputs.url }}
        run: |
          test -n "$WEBSITE_TEST_URL"
          pnpm --filter website e2e --project content

  release:
    name: Prepare release PR
    needs: [check, scope, verify-deployment]
    if: >-
      github.repository == 'apetta/spinetab' && github.ref == 'refs/heads/main' &&
      vars.RELEASE_PLEASE_ENABLED == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    uses: ./.github/workflows/release-please.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  packed-consumers:
    name: Packed consumer release verification
    if: >-
      (github.event_name == 'pull_request' && needs.scope.outputs.package == 'true') ||
      (github.event_name == 'workflow_dispatch' && !inputs.deploy)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SPINETAB_CONSUMERS_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          persist-credentials: false
      - name: Verify consumer builds, declarations and peer isolation
        uses: ./.github/actions/verify-consumers
      - name: Verify packed development and production apps
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter spinetab e2e:consumers
      - name: Upload consumer reports and failure traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: packed-consumer-release-results
          path: |
            packages/spinetab/test-results/consumers/
            packages/spinetab/test-results/tree-shaking/
          retention-days: 7
          if-no-files-found: error
