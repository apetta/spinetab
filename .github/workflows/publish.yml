name: Publish

on:
  push:
    branches: [main]
    paths: [packages/spinetab/package.json]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact main merge commit to publish
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: >-
      github.repository == 'apetta/spinetab' && github.ref == 'refs/heads/main' &&
      vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Identify an approved unpublished release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
        run: python3 .github/maintenance/publish.py plan

  verify:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-verification.yml
    with:
      expected_sha: ${{ needs.plan.outputs.sha }}

  publish:
    needs: [plan, verify]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-release
          path: release
          github-token: ${{ github.token }}
      - name: Verify source, supervisor decision and tested archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/maintenance/publish.py verify
      - name: Publish the verified archive with short-lived OIDC credentials
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish "./release/spinetab-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
