name: Release Please

on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: >-
      github.repository == 'apetta/spinetab' && github.ref == 'refs/heads/main' &&
      vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - name: Create a short-lived token for this repository only
        id: identity
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: apetta
          repositories: spinetab
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.identity.outputs.token }}
          config-file: .github/maintenance/release-please.json
          manifest-file: .release-please-manifest.json
