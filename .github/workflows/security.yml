name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record published npm version
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import datetime, json, re, urllib.request
          url = 'https://registry.npmjs.org/spinetab/latest'
          request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
          with urllib.request.urlopen(request, timeout=30) as response:
              package = json.load(response)
          version = package.get('version', '')
          if package.get('name') != 'spinetab' or not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('The registry did not return a stable Spinetab version')
          print(json.dumps({'registry': url, 'name': 'spinetab', 'version': version,
                            'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          PY
      - name: Check published dependency advisories
        run: pnpm audit --audit-level high
