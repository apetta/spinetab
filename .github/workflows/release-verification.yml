name: Release verification

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact source commit for publication verification
        type: string
        required: true
  pull_request:
    paths:
      - .github/actions/verify-workspace/**
      - .github/actions/verify-consumers/**
      - .github/workflows/release-verification.yml
      - .github/workflows/ci.yml
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    name: ${{ github.event_name == 'pull_request' && 'Release safeguards' || 'Maintenance guards' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          persist-credentials: false
      - name: Test maintenance safeguards
        run: python3 -m unittest discover -s .github/maintenance -p '*_test.py'

  check:
    name: ${{ github.event_name == 'pull_request' && 'Uncached workspace verification' || 'Lint, Typecheck, Test, E2E' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_CACHE: "local:,remote:"
    steps:
      - name: Require verification without OIDC access
        run: test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          persist-credentials: false
      - name: Verify workspace
        uses: ./.github/actions/verify-workspace
        with:
          release: "true"

  packed-consumers:
    name: ${{ github.event_name == 'pull_request' && 'Packed release verification' || 'Packed consumer release verification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SPINETAB_CONSUMERS_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      TURBO_CACHE: "local:,remote:"
    steps:
      - name: Require verification without OIDC access
        run: test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          persist-credentials: false
      - name: Verify consumer builds, declarations and peer isolation
        uses: ./.github/actions/verify-consumers
      - name: Verify packed development and production apps
        run: pnpm --filter spinetab e2e:consumers
      - name: Preserve verified release tarball
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            import { execFileSync } from "node:child_process";
            import { assertFreshPack } from "./packages/spinetab/tests/package/consumers/prepare.ts";
            import { packDir } from "./packages/spinetab/tests/package/consumers/paths.ts";
            const record = assertFreshPack("release upload");
            const tarball = join(packDir(), record.file);
            const sha256 = createHash("sha256").update(readFileSync(tarball)).digest("hex");
            if (sha256 !== record.sha256) throw new Error("Verified tarball integrity changed");
            mkdirSync("release", { recursive: true });
            const pkg = JSON.parse(readFileSync("packages/spinetab/package.json"));
            copyFileSync(tarball, join("release", `spinetab-${pkg.version}.tgz`));
            const receipt = {
              repository: process.env.GITHUB_REPOSITORY,
              sha: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
              version: pkg.version,
              sha256,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            };
            writeFileSync("release/verification.json", JSON.stringify(receipt) + "\n");
          '
      - name: Upload verified release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
      - name: Upload consumer reports and failure traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: packed-consumer-release-results
          path: |
            packages/spinetab/test-results/consumers/
            packages/spinetab/test-results/tree-shaking/
          retention-days: 7
          if-no-files-found: error
