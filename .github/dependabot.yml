version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:17"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:17"
      timezone: Europe/London
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
